<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cryptadoodle</title>
<style>
  :root { --ink:#1d1d1f; --paper:#fbfaf6; --line:#d6d3ca; --accent:#2f6fde; --ok:#2e8b57; --bad:#c0392b; --muted:#6b6b6b; --open:#e2e2e2; --open-ink:#8a8a8a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--ink); background:var(--paper); }
  .col { max-width:430px; margin:0 auto; padding:12px 12px 24px; min-height:100vh; display:flex; flex-direction:column; gap:12px; }
  header { display:flex; align-items:center; justify-content:space-between; }
  h1 { font-size:20px; margin:0; }
  button { font:inherit; min-height:44px; min-width:44px; border:1px solid var(--line); background:#fff; border-radius:8px; padding:0 12px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }

  #scorebar { display:flex; justify-content:center; align-items:baseline; gap:8px; }
  #scorebar .label { font-size:28px; font-weight:700; color:var(--ink); }
  #score { font-size:28px; font-weight:700; }
  #score.neg { color:var(--bad); }

  #theme { text-align:center; font-size:14px; color:var(--muted); min-height:20px; }

  #board { display:flex; flex-wrap:wrap; gap:12px 16px; justify-content:center; padding:4px 0; }
  .word { display:flex; gap:4px; flex:0 0 auto; flex-wrap:nowrap; justify-content:center; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .tile { width:var(--tw,34px); height:var(--th,40px); min-width:0; min-height:0; padding:0; font-size:var(--tf,18px); display:flex; align-items:center; justify-content:center; border-radius:6px; }
  .tile.open { background:var(--open); color:var(--open-ink); font-weight:400; border-color:#cfcfcf; }
  .tile.done { background:#fff; color:var(--ink); font-weight:800; border-color:var(--ink); }
  .tile.sel { outline:2px solid var(--accent); outline-offset:1px; }
  .val { font-size:12px; color:var(--muted); min-height:14px; line-height:14px; }

  .entry { display:flex; gap:8px; justify-content:center; align-items:center; }
  #entryBox { width:64px; height:52px; text-align:center; font-size:24px; font-weight:700; text-transform:uppercase; border:2px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  #entryBox:focus { outline:none; border-color:var(--accent); }
  #entryBox:disabled { background:#f0efea; }
  #entryBox.shake { animation: shake .35s; border-color:var(--bad); }
  @keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
  #selinfo { min-height:24px; font-size:15px; text-align:center; }
  #selinfo b { font-weight:700; }

  #alert { display:none; position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:10; width:calc(100% - 24px); max-width:406px; background:var(--bad); color:#fff; border-radius:8px; padding:12px; text-align:center; font-weight:700; font-size:17px; box-shadow:0 4px 14px rgba(0,0,0,.2); }
  #alert.show { display:block; }
  #alert.good { background:var(--ok); }
  #score.flash { animation: flash .5s; }
  @keyframes flash { 0%,100% { transform:scale(1); } 40% { transform:scale(1.25); } }

  .stage { display:flex; gap:12px; align-items:stretch; }
  .stage::before { content:""; flex:0 0 37px; } /* same width as the tray column, so the board centers on the page */
  .play { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  #trayWrap { flex:0 0 auto; width:37px; border-left:1px solid var(--line); padding-left:10px; }
  .topRow { display:flex; align-items:flex-start; gap:12px; }
  #theme { flex:1; min-width:0; }
  #trayHead { flex:0 0 auto; font-size:12px; color:var(--muted); line-height:1.2; white-space:nowrap; text-align:right; margin-top:2px; }
  .chip { display:inline-flex; align-items:center; justify-content:center; width:26px; height:30px; border:1px solid var(--ink); border-radius:6px; background:#fff; color:var(--ink); font-weight:800; font-size:16px; vertical-align:middle; }
  #trayWrap.show { display:block; }
  #tray { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  #tray span { display:flex; align-items:center; justify-content:center; width:26px; height:30px; border-radius:5px; font-weight:700; font-size:13px; background:var(--open); color:var(--open-ink); }
  #tray span.good { background:var(--ok); color:#fff; }
  #tray span.bad { background:var(--bad); color:#fff; }
  #tray-label { font-size:12px; color:var(--muted); text-align:center; }

  .row { display:flex; justify-content:flex-end; align-items:center; gap:8px; }
  #msg { min-height:24px; text-align:center; font-size:15px; }
  /* The entry panel. On a phone with the keyboard up it floats directly above the keyboard. */
  #dockInner { border:2px solid var(--accent); border-radius:12px; background:var(--paper); padding:8px 8px 10px; }
  #dockInner.floating { position:fixed; z-index:5; left:50%; transform:translateX(-50%); bottom:var(--kb,0px); width:min(430px, calc(100% - 16px)); box-shadow:0 -4px 14px rgba(0,0,0,.12); }
  .tutorial { text-align:center; font-size:15px; color:var(--ink); font-weight:600; min-height:22px; border:2px solid var(--accent); border-radius:12px; background:var(--paper); padding:8px 10px; }
  #solvedBox { display:none; background:#fff; border:1px solid var(--ok); border-radius:10px; padding:12px; text-align:center; }
  #solvedBox.show { display:block; }
  footer { margin-top:auto; font-size:13px; color:var(--muted); text-align:center; line-height:1.6; }
  footer a { color:var(--muted); }
  dialog { border:1px solid var(--line); border-radius:12px; max-width:400px; width:calc(100% - 24px); color:var(--ink); }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  dialog h2 { font-size:18px; margin:0 0 8px; }
  dialog p, dialog li { font-size:15px; line-height:1.5; }
  dialog ul { padding-left:20px; margin:8px 0; }
  .muted { color:var(--muted); font-size:13px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<main class="col">
  <header>
    <h1>Cryptadoodle</h1>
    <button id="helpBtn" type="button">How to play</button>
  </header>

  <div class="topRow">
    <div id="theme"></div>
    <div id="trayHead">Letters Used</div>
  </div>

  <div class="stage">
  <div class="play">
  <section id="board" aria-label="Puzzle"></section>

  <div id="dock">
  <div id="dockInner">
  <div id="selinfo" aria-live="polite"></div>

  <form id="entry" class="entry" autocomplete="off">
    <input id="entryBox" type="text" maxlength="1" inputmode="text" autocapitalize="characters"
           autocorrect="off" spellcheck="false" enterkeyhint="go" disabled
           aria-label="Your letter guess">
    <button id="guessBtn" class="primary" type="button" disabled>Guess</button>
  </form>
  </div>
  </div>

  <div id="scorebar">
    <span class="label">Score</span>
    <span id="score">0</span>
  </div>
  </div>

  <div id="trayWrap">
    <div id="tray" aria-label="Letters used"></div>
  </div>
  </div>

  <div id="alert" role="alert"></div>

  <div id="tutorial" class="tutorial" style="display:none"></div>

  <div id="msg" aria-live="polite"></div>

  <div class="row">
    <button id="newBtn" type="button">New puzzle</button>
  </div>

  <div id="solvedBox">
    <p><b>Solved.</b> <span id="finalScore"></span></p>
    <p id="finalQuote" class="muted"></p>
  </div>

  <footer>
    <div>Build 0.1.0-p3.15 (prototype)</div>
    <div>
      <a href="https://jeremytoeman.com">JeremyToeman.com</a> ·
      <a href="https://ko-fi.com/jeremyt37">Ko-fi</a> ·
      <a href="https://froobaloo.com">Froobaloo</a>
    </div>
  </footer>
</main>

<script>
const RARITY = {A:1,B:3,C:3,D:2,E:1,F:4,G:2,H:4,I:1,J:8,K:5,L:1,M:3,N:1,O:1,P:3,Q:10,R:1,S:1,T:1,U:1,V:4,W:4,X:8,Y:4,Z:10};
const WRONG_PENALTY = 1;
// theme is optional; any puzzle can carry one.
const QUOTES = [
  { text: "To be or not to be", theme: "William Shakespeare, Hamlet" },
  { text: "Knowledge is power", theme: "Francis Bacon" },
  { text: "Where there is a will, there is a way", theme: "Proverb" },
  { text: "Stay hungry, stay foolish", theme: "Whole Earth Catalog" }
];
// short quote used by the interactive tutorial
const TUTORIAL = { text: "Know thyself", theme: "Ancient Greek maxim" };
// Shared Google Sheet (froobaloodb), tab "Cryptadoodle": columns Date, Quote, Theme, Status.
// Read in the browser the same way Sourceword reads its tab. QUOTES is the fallback.
const SHEET_ID = "1x6s2B4He9OoMUQgSuK1Rm3Ag7QWJ_ZuvaygkUGn_POo";
const SHEET_TAB = "Cryptadoodle";
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

let quoteIdx = -1;
let puzzle = null;      // { quote, theme, words: [[{plain, cipher}]], dec }
let revealed = new Set();   // cipher letters solved
let wrongPairs = new Set(); // "CODE+PLAIN" combinations guessed wrong
let selected = null;        // cipher letter
let guess = "";
let score = 0;
let alertTimer = null;
let tutorialMode = false;
let randomMode = false;     // true after "New puzzle": draw from the sheet at random
let sheetQuotes = [];       // rows from the sheet: { date: "YYYY-MM-DD" | null, text, theme }
let dailyQuote = null;      // today's row from the sheet, if there is one

const entry = document.getElementById("entryBox");
const guessBtn = document.getElementById("guessBtn");

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Minimal CSV parser (quoted fields, embedded commas), as used by Sourceword.
function parseCsv(text) {
  const rows = [];
  let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { row.push(field); field = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += ch;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// Today's date in New York, as YYYY-MM-DD, to match the sheet's dates.
function todayNY() {
  return new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
}

// Sheet dates look like 9/23/2026.
function parseSheetDate(s) {
  const m = s.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m ? `${m[3]}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}` : null;
}

async function loadSheetQuotes() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}`;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 8000);
  try {
    const res = await fetch(url, { signal: ctl.signal, cache: "no-cache" });
    if (!res.ok) throw new Error("sheet HTTP " + res.status);
    const all = parseCsv(await res.text());
    const header = (all[0] || []).map(h => h.trim().toLowerCase());
    if (!header.includes("quote")) throw new Error("sheet: Cryptadoodle tab not found");
    const iDate = header.indexOf("date"), iQuote = header.indexOf("quote"), iTheme = header.indexOf("theme");
    const out = [];
    for (const r of all.slice(1)) {
      const text = (r[iQuote] || "").trim();
      if (text) out.push({ date: iDate >= 0 ? parseSheetDate(r[iDate] || "") : null, text, theme: iTheme >= 0 ? (r[iTheme] || "").trim() : "" });
    }
    if (!out.length) throw new Error("sheet: no usable rows");
    return out;
  } finally {
    clearTimeout(timer);
  }
}

function newPuzzle() {
  let q = TUTORIAL;
  if (!tutorialMode) {
    if (!randomMode && dailyQuote) {
      q = dailyQuote;
    } else {
      const pool = sheetQuotes.length ? sheetQuotes : QUOTES;
      let next;
      do { next = Math.floor(Math.random() * pool.length); } while (pool.length > 1 && next === quoteIdx);
      quoteIdx = next;
      q = pool[quoteIdx];
    }
  }
  const words = q.text.toUpperCase().match(/[A-Z]+/g);
  // no letter may stand for itself: redraw until the permutation has no fixed points
  let perm;
  do { perm = shuffle([...LETTERS]); } while (perm.some((p, i) => p === LETTERS[i]));
  const enc = {}, dec = {};
  LETTERS.forEach((p, i) => { enc[p] = perm[i]; dec[perm[i]] = p; });
  puzzle = {
    quote: q.text,
    theme: q.theme || "",
    words: words.map(w => [...w].map(p => ({ plain: p, cipher: enc[p] }))),
    dec
  };
  revealed = new Set();
  wrongPairs = new Set();
  selected = null;
  guess = "";
  score = 0;
  entry.value = "";
  document.getElementById("solvedBox").classList.remove("show");
  hideAlert();
  setMsg("");
  render();
}

function unrevealedInWord(wi) {
  return puzzle.words[wi].filter(t => !revealed.has(t.cipher)).length;
}

// Current value of one occurrence of an unrevealed code letter.
function valueOf(c) {
  let min = Infinity;
  puzzle.words.forEach((w, wi) => {
    if (w.some(t => t.cipher === c)) min = Math.min(min, unrevealedInWord(wi));
  });
  return min * RARITY[puzzle.dec[c]];
}

function occurrences(c) {
  return puzzle.words.flat().filter(t => t.cipher === c).length;
}

function totalCodeLetters() {
  return new Set(puzzle.words.flat().map(t => t.cipher)).size;
}

function select(c) {
  if (revealed.has(c)) return;
  selected = c;
  guess = "";
  entry.value = "";
  setMsg("");
  render();
  entry.focus();
  keepSelectedVisible();
  [150, 400, 800].forEach(ms => setTimeout(updateDock, ms));
}

// On phones the keyboard shrinks the screen and the browser can scroll the selected tile out of view.
// Keep the selected tile near the top of what is visible, above the keyboard.
function keepSelectedVisible() {
  const el = document.querySelector("button.tile.sel");
  if (!el) return;
  const vv = window.visualViewport;
  const top = vv ? vv.offsetTop : 0;
  const delta = el.getBoundingClientRect().top - (top + 120);
  if (Math.abs(delta) > 4) window.scrollBy({ top: delta, behavior: "auto" });
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => {
    if (selected) requestAnimationFrame(keepSelectedVisible);
  });
}

// Float the entry panel just above the phone keyboard while a tile is picked.
const dock = document.getElementById("dock");
const dockInner = document.getElementById("dockInner");
function updateDock() {
  const vv = window.visualViewport;
  const kb = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
  document.documentElement.style.setProperty("--kb", kb + "px");
  const open = kb > 80 && selected !== null;
  if (open && !dockInner.classList.contains("floating")) {
    dock.style.height = dockInner.offsetHeight + "px"; // keep the space so the page doesn't jump
    dockInner.classList.add("floating");
  } else if (!open && dockInner.classList.contains("floating")) {
    dockInner.classList.remove("floating");
    dock.style.height = "";
  }
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => { updateDock(); if (selected) requestAnimationFrame(keepSelectedVisible); });
  window.visualViewport.addEventListener("scroll", updateDock);
}
entry.addEventListener("blur", () => setTimeout(updateDock, 300));

function showAlert(letter, detail, good) {
  const a = document.getElementById("alert");
  a.textContent = `Last guess: ${letter}: ${detail}`;
  a.className = "show" + (good ? " good" : "");
  clearTimeout(alertTimer);
  alertTimer = setTimeout(hideAlert, 2600);
  // keep the last result in the message line, with the guessed letter as a tile
  document.getElementById("msg").innerHTML = `Last guess: <span class="chip">${letter}</span>: ${detail}`;
  const s = document.getElementById("score");
  s.classList.remove("flash");
  void s.offsetWidth;
  s.classList.add("flash");
}

function hideAlert() {
  const a = document.getElementById("alert");
  a.className = "";
  a.textContent = "";
}

function shakeEntry() {
  entry.classList.remove("shake");
  void entry.offsetWidth; // restart animation
  entry.classList.add("shake");
}

function submit() {
  if (!selected) { setMsg("Tap a tile first."); return; }
  if (!guess) { setMsg("Type a letter first."); return; }
  const c = selected;
  const g = guess;
  if (wrongPairs.has(c + g) || foundPlain().has(g)) {
    setMsg(`Already guessed ${g}.`);
    guess = ""; entry.value = "";
    shakeEntry(); entry.focus(); render();
    return;
  }
  if (guess === puzzle.dec[c]) {
    const v = valueOf(c);
    const n = occurrences(c);
    const pts = v * n;
    revealed.add(c);
    score += pts;
    selected = null;
    guess = "";
    entry.value = "";
    entry.blur();
    showAlert(g, `right, +${pts}`, true);
    if (revealed.size === totalCodeLetters()) showWin();
  } else {
    score -= WRONG_PENALTY;
    wrongPairs.add(c + guess);
    guess = "";
    entry.value = "";
    showAlert(g, `wrong, −${WRONG_PENALTY}`, false);
    shakeEntry();
    entry.focus();
  }
  render();
}

// Points for one code letter, given a set of already-revealed code letters.
function valueIn(c, rev) {
  let min = Infinity;
  puzzle.words.forEach(w => {
    if (w.some(t => t.cipher === c)) min = Math.min(min, w.filter(t => !rev.has(t.cipher)).length);
  });
  return min * RARITY[puzzle.dec[c]];
}

// Best possible score for this puzzle: every guess right, in the best order.
function maxPossible() {
  const codes = [...new Set(puzzle.words.flat().map(t => t.cipher))];
  const full = (1 << codes.length) - 1;
  const memo = new Map();
  const toSet = mask => new Set(codes.filter((_, i) => mask & (1 << i)));
  function best(mask) {
    if (mask === full) return 0;
    if (memo.has(mask)) return memo.get(mask);
    const rev = toSet(mask);
    let b = 0;
    codes.forEach((c, i) => {
      if (!(mask & (1 << i))) b = Math.max(b, valueIn(c, rev) * occurrences(c) + best(mask | (1 << i)));
    });
    memo.set(mask, b);
    return b;
  }
  return best(0);
}

function showWin() {
  document.getElementById("solvedBox").classList.add("show");
  document.getElementById("finalScore").textContent = `Score ${score}. Max possible: ${maxPossible()}.`;
  document.getElementById("finalQuote").textContent = `"${puzzle.quote}"`;
}

function setMsg(t) { document.getElementById("msg").textContent = t; }

// Tutorial: one step at a time, using the same rules as a real puzzle. No answers are given.
const TUT_STEPS = [
  { done: () => selected !== null || revealed.size > 0, text: "Tap a tile to pick a code letter." },
  { done: () => wrongPairs.size > 0 || revealed.size > 0, text: "Type a letter in the box and press Guess. A wrong guess costs 1." },
  { done: () => revealed.size > 0, text: "A right guess reveals every tile with that code letter and scores points. An unrevealed letter is worth the letters left in its word times its tile value." },
  { done: () => revealed.size === totalCodeLetters(), text: "Keep going. Letters Used on the right shows letters you can't use anymore." }
];
function renderTutorial() {
  const el = document.getElementById("tutorial");
  if (!tutorialMode) { el.style.display = "none"; el.textContent = ""; return; }
  el.style.display = "";
  const step = TUT_STEPS.find(s => !s.done());
  el.textContent = step ? `Tutorial: ${step.text}` : "Tutorial complete. Press New puzzle to play a real quote.";
}

// Words never wrap: shrink the tiles so the longest word fits the play area.
function fitTiles() {
  const play = document.querySelector(".play");
  const maxLen = Math.max(...puzzle.words.map(w => w.length));
  const avail = (play.clientWidth || 340) - 8;
  const w = Math.max(14, Math.min(34, Math.floor((avail - (maxLen - 1) * 4) / maxLen)));
  const st = document.documentElement.style;
  st.setProperty("--tw", w + "px");
  st.setProperty("--th", Math.round(w * 1.18) + "px");
  st.setProperty("--tf", Math.max(9, Math.round(w * 0.53)) + "px");
}
window.addEventListener("resize", () => { if (puzzle) { fitTiles(); } });

function foundPlain() {
  return new Set([...revealed].map(c => puzzle.dec[c]));
}

function render() {
  // score and theme
  const scoreEl = document.getElementById("score");
  scoreEl.textContent = score;
  scoreEl.classList.toggle("neg", score < 0);
  document.getElementById("theme").textContent = puzzle.theme ? `Theme: ${puzzle.theme}` : "";

  // board
  const board = document.getElementById("board");
  board.innerHTML = "";
  puzzle.words.forEach(w => {
    const wd = document.createElement("div");
    wd.className = "word";
    w.forEach(t => {
      const isDone = revealed.has(t.cipher);
      const cell = document.createElement("div");
      cell.className = "cell";

      const b = document.createElement("button");
      b.type = "button";
      b.className = "tile " + (isDone ? "done" : "open") + (selected === t.cipher ? " sel" : "");
      b.textContent = isDone ? t.plain : t.cipher;
      b.setAttribute("aria-label", isDone ? `${t.plain}, revealed` : `code letter ${t.cipher}`);
      b.dataset.c = t.cipher;

      const val = document.createElement("span");
      val.className = "val";
      val.textContent = isDone ? "" : valueOf(t.cipher);

      cell.appendChild(b);
      cell.appendChild(val);
      wd.appendChild(cell);
    });
    board.appendChild(wd);
  });

  fitTiles();
  renderTutorial();

  // entry state
  entry.disabled = !selected;
  guessBtn.disabled = !selected || !guess;

  const info = document.getElementById("selinfo");
  if (selected) {
    info.innerHTML = `Code <b>${selected}</b> · worth ${valueOf(selected)} each · appears ${occurrences(selected)}×`;
  } else {
    info.textContent = revealed.size === totalCodeLetters() ? "" : "Tap a tile to start.";
  }

  // letter tray: hidden until a guess is made; then only letters in use (found or tried).
  // green = found; red = tried against every still-open code letter; grey = tried.
  const found = foundPlain();
  const open = [...new Set(puzzle.words.flat().map(t => t.cipher))].filter(c => !revealed.has(c));
  // only letters that can no longer be used: found, or tried wrong in every open spot
  const letters = [...new Set(puzzle.words.flat().map(t => t.plain))];
  const unavailable = letters
    .filter(l => found.has(l) || (open.length > 0 && open.every(c => wrongPairs.has(c + l))))
    .sort();
  const tray = document.getElementById("tray");
  tray.innerHTML = "";
  unavailable.forEach(l => {
    const s = document.createElement("span");
    s.textContent = l;
    s.className = found.has(l) ? "good" : "bad";
    tray.appendChild(s);
  });
}

// Tile taps: one delegated listener, so taps always reach select().
document.getElementById("board").addEventListener("click", e => {
  const b = e.target.closest("button.tile");
  if (b && b.dataset.c) select(b.dataset.c);
});

// Surface any script error on the page instead of failing silently.
window.addEventListener("error", e => {
  document.getElementById("msg").textContent = "Error: " + e.message;
});

entry.addEventListener("input", () => {
  const m = entry.value.toUpperCase().match(/[A-Z]/g);
  guess = m ? m[m.length - 1] : "";
  entry.value = guess;
  guessBtn.disabled = !selected || !guess;
});

// Guess works from a plain click and from Enter; no reliance on form submit.
guessBtn.addEventListener("click", () => submit());
entry.addEventListener("focus", () => {
  [150, 400, 800].forEach(ms => setTimeout(() => { keepSelectedVisible(); updateDock(); }, ms));
});
entry.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); submit(); }
});
document.getElementById("entry").addEventListener("submit", e => {
  e.preventDefault();
  submit();
});

document.getElementById("newBtn").onclick = () => { tutorialMode = false; randomMode = true; newPuzzle(); };
document.getElementById("helpBtn").onclick = () => { tutorialMode = true; newPuzzle(); };

newPuzzle(); // shows immediately, so the page works offline

// Then read the sheet. If today's row exists and nothing has been played yet, switch to it.
loadSheetQuotes()
  .then(all => {
    sheetQuotes = all;
    dailyQuote = all.find(q => q.date === todayNY()) || null;
    if (dailyQuote && !tutorialMode && score === 0 && revealed.size === 0 && selected === null) newPuzzle();
  })
  .catch(err => console.warn("Cryptadoodle: sheet unavailable, using built-in quotes:", err));
</script>
